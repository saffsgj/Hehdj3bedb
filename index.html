<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشغل الفيديو</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

iframe {
    width: 100%;
    height: 100vh;
    border: none;
}
</style>
</head>

<body>

<iframe
    src="https://tvnise.site/albaplayer/fder/?serv=2"
    allowfullscreen>
</iframe>

<script>
// تعطيل الزر الأيمن
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
});

// تعطيل بعض الاختصارات
document.addEventListener('keydown', function(e) {

    if (e.key === 'F12') {
        e.preventDefault();
    }

    if (e.ctrlKey && e.shiftKey &&
        (e.key === 'I' || e.key === 'J' || e.key === 'C')) {
        e.preventDefault();
    }

    if (e.ctrlKey && e.key === 'U') {
        e.preventDefault();
    }
});
</script>

</body>
</html>
